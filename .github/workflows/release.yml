name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 1.0（手动触发必填，将自动创建同名 tag）'
        required: false
        default: ''

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME
          }
          else {
            $v = "${{ inputs.version }}".Trim()
          }
          if (-not $v) {
            Write-Error "手动触发时必须在 version 输入框填写版本号（如 1.0），或改为推送 tag 触发"
            exit 1
          }
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "release version: $v"

      - name: Download step.exe
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'step_windows_amd64.zip'
          Invoke-WebRequest -Uri 'https://github.com/smallstep/cli/releases/download/v0.30.6/step_windows_amd64.zip' -OutFile $zip
          $dest = Join-Path $env:RUNNER_TEMP 'step_zip'
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Copy-Item (Join-Path $dest 'step_windows_amd64\bin\step.exe') 'StepGui\step.exe' -Force
          StepGui\step.exe version

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        run: msbuild StepGui\StepGui.csproj /p:Configuration=Release /p:Platform=AnyCPU /v:m /nologo

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $out = "StepGui-$ver"
          $stage = Join-Path $env:RUNNER_TEMP $out
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item StepGui\bin\Release\* $stage -Recurse -Force
          Remove-Item (Join-Path $stage '*.pdb') -ErrorAction SilentlyContinue
          if (Test-Path (Join-Path $stage 'certs')) { Remove-Item (Join-Path $stage 'certs') -Recurse -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "$out.zip"
          Write-Output "packed $out.zip"

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: StepGui ${{ steps.ver.outputs.version }}
          files: StepGui-*.zip
          generate_release_notes: true
